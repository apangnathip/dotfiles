exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprland-session.target

# exec-once = waybar & hyprpaper & rog-control-center
# exec-once = clipse -listen 
# exec-once = /usr/lib/polkit-kde-authentication-agent-1 

# $terminal = foot 
# $explorer = $terminal -e yazi 
# $browser = zen-browser
# $menu = rofi

monitor = eDP-1, 1920x1080@165.00Hz, auto, 1
monitor = DP-2, 1920x1080@165.00Hz, auto, 1 

# {{{ Inputs & Keybinds 

input {
    kb_layout = us
    repeat_delay = 165 
    repeat_rate = 30
    follow_mouse = 1
    accel_profile = flat
    touchpad {
        natural_scroll = true 
    }
}

gesture = 3, horizontal, workspace

bind = alt, q, killactive,
bind = alt, v, togglefloating,
bind = alt, f, fullscreen,
bind = alt, i, pseudo, 
bind = alt, o, togglesplit, 
bind = alt shift, v, workspaceopt, allfloat

# bind = alt shift, c, exec, hyprpicker -a
# bind = alt shift, F12, exec, hyprshot --freeze -m window
# bind = alt shift, s, exec, hyprshot --freeze -m region
# bind = alt, F12, exec, hyprshot --freeze -m output 
# bind = super, l, exec, hyprlock
bind = super, delete, exit,

bind = super alt, L, exec, qs -c noctalia-shell ipc call lockScreen lock
bind = super, space, exec, qs -c noctalia-shell ipc call launcher toggle
bind = super, c, exec, qs -c noctalia-shell ipc call launcher clipboard
bind = super, tab, exec, qs -c noctalia-shell ipc call controlCenter toggle
bind = super, comma, exec, qs -c noctalia-shell ipc call settings toggle
bind = super, w, exec, qs -c noctalia-shell ipc call wallpaper toggle
bind = ctrl alt, delete, exec, qs -c noctalia-shell ipc call sessionMenu toggle

# Apps
bind = ,XF86Launch1, exec, rog-control-center
bind = super, b, exec, app2unit -- qutebrowser
bind = super, e, exec, app2unit -- foot yazi
bind = super, return, exec, app2unit -- foot tmux new-session -t ground
bind = alt, space, exec, rofi -show drun

# Move focus 
bind = alt, h, movefocus, l
bind = alt, l, movefocus, r
bind = alt, k, movefocus, u
bind = alt, j, movefocus, d

# Move windows
bind = alt shift, h, movewindow, l 
bind = alt shift, l, movewindow, r 
bind = alt shift, k, swapwindow, u 
bind = alt shift, j, swapwindow, d 

# Resize windows
binde = alt, right, resizeactive, 50 0
binde = alt, left, resizeactive, -50 0
binde = alt, up, resizeactive, 0 -50
binde = alt, down, resizeactive, 0 50

# Switch workspaces 
bind = alt, 1, workspace, 1
bind = alt, 2, workspace, 2
bind = alt, 3, workspace, bind = alt, 4, workspace, 4
bind = alt, 7, workspace, 5
bind = alt, 8, workspace, 6
bind = alt, 9, workspace, 7
bind = alt, 0, workspace, 8

# Move active window to a workspace
bind = alt shift, 1, movetoworkspace, 1
bind = alt shift, 2, movetoworkspace, 2
bind = alt shift, 3, movetoworkspace, 3
bind = alt shift, 4, movetoworkspace, 4
bind = alt shift, 7, movetoworkspace, 5
bind = alt shift, 8, movetoworkspace, 6
bind = alt shift, 9, movetoworkspace, 7
bind = alt shift, 0, movetoworkspace, 8

# Scroll through existing workspaces with mod + scroll
bind = alt, mouse_down, workspace, e+1
bind = alt, mouse_up, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = alt, mouse:272, movewindow
bindm = alt, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, qs -c noctalia-shell ipc call brightness increase
bindel = ,XF86MonBrightnessDown, exec, qs -c noctalia-shell ipc call brightness decrease 


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# }}}

# {{{ Theming 

# https://wiki.hypr.land/Configuring/Variables/#general

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(BEBCD1FF) rgba(7C7892FF) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle 
}

decoration {
  rounding = 10 
  rounding_power = 2

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 3
    passes = 2
    vibrancy = 0.1696
  }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# }}}

# {{{ Windows & Workspaces

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}


workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2

dwindle {
    pseudotile = true 
    preserve_split = true 
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
}

# }}}

# {{{ Plugins 

plugin {
    hyprscrolling {
        fullscreen_on_one_column = true 
    }
    hyprexpo {
        columns = 2
        gap_size = 5
        bg_col = rgb(1C1522)
        workspace_method = center current 
        skip_empty = true
        gesture_distance = 300 
    }
}

# }}}


