$font = JetBrainsMono NF Propo

general {
    hide_cursor = true 
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/wallpapers/sakura.jpg
    blur_passes = 2
    contrast = 1
    brightness = 0.8
}

input-field {
    monitor =
    size = 180, 50
    outline_thickness = 1
    dots_size = 0.2 
    dots_spacing = 0.35 
    dots_center = true
    outer_color = rgba(eeeeee08)
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgb(FFFFFF) 
    fade_on_empty = true 
    rounding = -1
    check_color = rgb(204, 136, 34)
    placeholder_text = <i><span foreground="##cdd6f4">Input Password...</span></i>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = JetBrainsMono
  position = 0, 120
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = rgba(242, 243, 244, 0.75)
  font_size = 95
  font_family = JetBrainsMono Extrabold
  position = 0, 20 
  halign = center
  valign = center
}

