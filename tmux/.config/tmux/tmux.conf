set -g default-shell $SHELL
set -a terminal-features "xterm-256color:RGB"
set -sg escape-time 10
set -wg pane-base-index 1
set -g base-index 1
set -g focus-events on
set -g automatic-rename on
set -g renumber-windows on
set -g status-position top 
set -g mode-keys vi
set -g popup-border-lines "rounded"
set -g mouse

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf

bind H run "~/.config/scripts/tmux-sessionizer.sh ~"
bind p display-popup -h14 -s "bg=terminal" -E "~/.config/scripts/tmux-sessionizer.sh" 
bind g display-popup -h3 -w21 -E "~/.config/scripts/open-github.sh; sleep 1; tmux popup -C"

bind -n M-k resize-pane -U 5
bind -n M-j resize-pane -D 5
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "christoomey/vim-tmux-navigator"

source-file ~/.cache/wal/colors-tmux.conf

set -g @thm_bg "#{@background}"
set -g @thm_fg "#{@foreground}"
set -g @thm_flamingo "#{@color15}"
set -g @thm_rosewater "#{@color15}"
set -g @thm_pink "#{@color5}"
set -g @thm_mauve "#{@color5}"
set -g @thm_red "#{@color1}"
set -g @thm_maroon "#{@color1}"
set -g @thm_peach "#{@color1}"
set -g @thm_yellow "#{@color3}"
set -g @thm_green "#{@color2}"
set -g @thm_teal "#{@color6}"
set -g @thm_sky "#{@color6}"
set -g @thm_sapphire "#{@color4}"
set -g @thm_lavender "#{@color4}"

set -g status-left "" 
set -g status-right "#S" 
set -g window-status-separator ""

set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_text_color "terminal"
set -g @catppuccin_window_number_color "#{@color8}"
set -g @catppuccin_window_current_text_color "terminal"
set -g @catppuccin_window_current_number_color "#{?client_prefix,#{@color2},#{@color4}},bold" 

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run "~/.config/tmux/plugins/tpm/tpm"

